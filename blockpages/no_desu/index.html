<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Centered Image</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f7f7f7;
			}

			img {
				width: 275px;
				height: auto;
			}
		</style>
	</head>
	<body>
		<img src="no_desu.jpg" alt="NO DESU" />
	</body>
</html>
