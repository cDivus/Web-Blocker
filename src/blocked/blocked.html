<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — Web Blocker</title>
  <link rel="stylesheet" href="../common/theme.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>

<body>
  <div class="page">

    <h1 id="block-message">You blocked this site for a reason.</h1>

    <p class="subtitle" id="block-rule" style="display: none;"></p>

    <p class="footer">Manage your block list in the Web Blocker extension.</p>

  </div>

  <iframe id="custom-frame" sandbox="allow-same-origin"
    style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 999999; background: #ffffff;"></iframe>

  <script type="module" src="blocked.js"></script>
</body>

</html>
