<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>Web Blocker</h1>
    </div>

    <div class="body">

      <!-- Block current site -->
      <button class="btn full-width" id="btn-block-current">Block This Site</button>

      <!-- Current Site Timer (if active) -->
      <div id="active-timer-box" style="display: none;">
        <div class="active-timer-header">
          <span class="active-timer-title">Time Left Today</span>
        </div>
        <span id="active-timer-target" class="active-timer-target"></span>
        <div class="analytics-bar-track">
          <div id="active-timer-bar" class="analytics-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="active-timer-footer">
          <span id="active-timer-text">0m 0s left today</span>
        </div>
      </div>

      <!-- Blocked count -->
      <div class="count-row">
        <span id="blocked-count">0 sites blocked</span>
      </div>

      <div class="divider"></div>

      <!-- Open settings -->
      <div id="popup-password-container" style="display: none; margin-bottom: 12px; width: 100%;">
        <div style="font-size: 0.76rem; font-weight: 700; text-transform: uppercase; margin-bottom: 6px;">Password Required</div>
        <input type="password" id="popup-password-input" placeholder="Password" style="width: 100%; padding: 8px; border: 1.5px solid #000000; font-family: inherit; font-size: 0.88rem; outline: none; box-sizing: border-box; margin-bottom: 6px;" />
        <div id="popup-password-error" style="font-size: 0.72rem; color: #cc0000; font-weight: 700; margin-bottom: 4px; display: none;"></div>
      </div>
      <button class="btn full-width" id="btn-settings">Open Settings</button>

    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
