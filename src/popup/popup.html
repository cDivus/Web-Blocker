<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Blocker</title>
  <link rel="icon" href="../../assets/icons/icon128.png" type="image/png" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>Web Blocker</h1>
    </div>

    <div class="body">

      <!-- Block current site -->
      <button class="btn full-width" id="btn-block-current">Block This Site</button>

      <!-- Current Site Timer (if active) -->
      <div id="active-timer-box" style="display: none;">
        <div class="active-timer-header">
          <span class="active-timer-title">Time Left Today</span>
        </div>
        <span id="active-timer-target" class="active-timer-target"></span>
        <div class="analytics-bar-track">
          <div id="active-timer-bar" class="analytics-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="active-timer-footer">
          <span id="active-timer-text">0m 0s left today</span>
        </div>
      </div>

      <!-- Blocked count -->
      <div class="count-row">
        <span id="blocked-count">0 sites blocked</span>
      </div>

      <div class="divider"></div>

      <!-- Open settings -->
      <div id="popup-password-container" style="display: none; width: 100%; margin-bottom: -4px;">
        <div
          style="font-size: 0.76rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; text-align: center; color: var(--text-primary);">
          Password Required</div>
        <input type="password" id="popup-password-input" placeholder="Password" />
        <div id="popup-password-error"
          style="font-size: 0.72rem; color: #cc0000; font-weight: 700; margin-top: 6px; text-align: center; display: none;">
        </div>
      </div>
      <button class="btn full-width" id="btn-settings">Open Settings</button>

    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
